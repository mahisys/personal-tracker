name: Publish Built APK as Release Asset

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run id that produced the APK artifact'
        required: true
      artifact_name:
        description: 'Artifact name'
        required: true
        default: personal-tracker-apk

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release with APK asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.event.inputs.run_id }}" \
            app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Personal Tracker APK" \
            --notes "Debug APK built from workflow run ${{ github.event.inputs.run_id }}."
